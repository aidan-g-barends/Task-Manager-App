<div>
  <div class="flex justify-between items-end mb-4">
    <div>
      <h2 class="text-2xl font-bold text-gray-900">Users</h2>
      <p class="text-sm text-gray-500 mt-1">Manage team access.</p>
    </div>
    <a routerLink="/users/new"
       class="bg-blue-600 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
      + New User
    </a>
  </div>

  <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
    @for (user of users(); track user.id) {
      <div class="flex items-center gap-4 p-4 border-b border-gray-200 last:border-b-0 hover:bg-gray-50 transition-colors">
        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-semibold">
          {{ user.name.charAt(0) }}
        </div>
        <div class="flex-1">
          <p class="font-medium text-gray-900">{{ user.name }}</p>
          <p class="text-sm text-gray-500">{{ user.email }}</p>
        </div>
        <a [routerLink]="['/users', user.id, 'edit']" class="text-gray-400 hover:text-blue-600 transition-colors">
          <span class="material-symbols-outlined text-lg">edit</span>
        </a>
        <button (click)="deleteUser(user.id)" class="text-gray-400 hover:text-red-600 transition-colors">
          <span class="material-symbols-outlined text-lg">delete</span>
        </button>
      </div>
    } @empty {
      <div class="p-8 text-center text-gray-500">No users yet.</div>
    }
  </div>
</div>
