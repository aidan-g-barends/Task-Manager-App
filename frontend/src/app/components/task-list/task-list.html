<div>
  <div class="mb-4">
    <h2 class="text-2xl font-bold text-gray-900">{{ heading() }}</h2>
    <p class="text-sm text-gray-500 mt-1">Manage and track project deliverables.</p>
  </div>

  <div class="relative mb-4">
    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg">search</span>
    <input type="text" placeholder="Search tasks..."
           (input)="onSearchChange($any($event.target).value)"
           class="w-full pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500" />
  </div>

  <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
    @for (task of tasks(); track task.id) {
      <div class="flex items-center gap-4 p-4 border-b border-gray-200 last:border-b-0 hover:bg-gray-50 transition-colors">
        <input type="checkbox" [checked]="task.completed" (change)="toggleComplete(task)"
               class="w-5 h-5 rounded border-gray-300 text-blue-600 cursor-pointer" />
        <div class="flex-1">
          <h4 class="font-medium text-gray-900 hover:text-blue-600">
            <a [routerLink]="['/tasks', task.id]">{{ task.title }}</a>
          </h4>
        </div>
        <span class="px-3 py-1 rounded-full text-xs font-medium flex items-center gap-1"
              [class.bg-red-100]="!task.completed"
              [class.text-red-700]="!task.completed"
              [class.bg-green-100]="task.completed"
              [class.text-green-700]="task.completed">
          {{ task.completed ? 'Done' : task.dueDate }}
        </span>
        <a [routerLink]="['/tasks', task.id, 'edit']" class="text-gray-400 hover:text-blue-600 transition-colors">
          <span class="material-symbols-outlined text-lg">edit</span>
        </a>
        <button (click)="deleteTask(task.id)" class="text-gray-400 hover:text-red-600 transition-colors">
          <span class="material-symbols-outlined text-lg">delete</span>
        </button>
      </div>
    } @empty {
      <div class="p-8 text-center text-gray-500">No tasks yet.</div>
    }
  </div>
</div>
