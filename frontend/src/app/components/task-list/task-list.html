<div>
  <div class="flex justify-between items-end mb-4">
    <div>
      <h2 class="text-2xl font-bold text-gray-900">All Tasks</h2>
      <p class="text-sm text-gray-500 mt-1">Manage and track project deliverables.</p>
    </div>
  </div>

  <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
    @for (task of tasks(); track task.id) {
      <div class="flex items-center gap-4 p-4 border-b border-gray-200 last:border-b-0 hover:bg-gray-50 transition-colors">
        <input type="checkbox" [checked]="task.completed"
               class="w-5 h-5 rounded border-gray-300 text-blue-600 cursor-pointer" />
        <div class="flex-1">
          <h4 class="font-medium text-gray-900" [class.line-through]="task.completed" [class.text-gray-400]="task.completed">
            {{ task.title }}
          </h4>
        </div>
        <span class="px-2.5 py-1 rounded-md text-xs font-medium"
              [class.bg-red-100]="!task.completed"
              [class.text-red-700]="!task.completed"
              [class.bg-green-100]="task.completed"
              [class.text-green-700]="task.completed">
          {{ task.completed ? 'Done' : task.dueDate }}
        </span>
        <button (click)="deleteTask(task.id)"
                class="text-gray-400 hover:text-red-600 transition-colors">
          <span class="material-symbols-outlined text-lg">delete</span>
        </button>
      </div>
    } @empty {
      <div class="p-8 text-center text-gray-500">No tasks yet.</div>
    }
  </div>
</div>
