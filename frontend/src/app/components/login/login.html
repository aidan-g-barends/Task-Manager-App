<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-white border border-gray-200 rounded-xl shadow-sm p-8 w-full max-w-sm space-y-5">
    <div>
      <h3 class="text-lg font-bold text-gray-900">Log In</h3>
      <p class="text-sm text-gray-500">Welcome back to Task Manager.</p>
    </div>

    @if (errorMessage) {
      <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-2">
        {{ errorMessage }}
      </div>
    }

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input formControlName="email" type="email" placeholder="you@example.com"
             class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input formControlName="password" type="password" placeholder="••••••••"
             class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100" />
    </div>

    <button type="submit" [disabled]="form.invalid"
            class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
      Log In
    </button>
  </form>
</div>
