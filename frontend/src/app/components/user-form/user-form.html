<form [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 space-y-5 max-w-md">
  <div>
    <h3 class="text-lg font-bold text-gray-900">New User</h3>
    <p class="text-sm text-gray-500">Add a user to your workspace.</p>
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
    <input formControlName="name" type="text" placeholder="e.g. Jane Doe"
           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100" />
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
    <input formControlName="email" type="email" placeholder="e.g. jane@example.com"
           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100" />
  </div>

  <button type="submit" [disabled]="form.invalid"
          class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
    Save User
  </button>
</form>
