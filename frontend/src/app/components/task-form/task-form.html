<form [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 space-y-5">
  <div>
    <h3 class="text-lg font-bold text-gray-900">New Task</h3>
    <p class="text-sm text-gray-500">Add a task to your workspace.</p>
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Task Title</label>
    <input formControlName="title" type="text" placeholder="e.g. Finish quarterly report"
           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100" />
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Due Date</label>
    <input formControlName="dueDate" type="date"
           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100" />
  </div>

  <div class="flex items-center justify-between bg-gray-50 rounded-lg px-4 py-3 border border-gray-200">
    <div>
      <span class="block text-sm font-medium text-gray-800">Mark as Completed</span>
      <span class="block text-xs text-gray-500">Close this task immediately</span>
    </div>
    <input formControlName="completed" type="checkbox" class="w-5 h-5 rounded text-blue-600" />
  </div>

  <button type="submit" [disabled]="form.invalid"
          class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
    Save Task
  </button>
</form>
