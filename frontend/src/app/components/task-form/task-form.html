<form [formGroup]="form" (ngSubmit)="onSubmit()" class="max-w-md mx-auto p-6 bg-white border border-gray-200 rounded-xl shadow-sm space-y-4">
  <h3 class="text-lg font-semibold text-gray-900">New Task</h3>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
    <input formControlName="title" type="text"
           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" />
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Due Date</label>
    <input formControlName="dueDate" type="date"
           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" />
  </div>

  <div class="flex items-center gap-2">
    <input formControlName="completed" type="checkbox" id="completed" />
    <label for="completed" class="text-sm text-gray-700">Mark as completed</label>
  </div>

  <button type="submit" [disabled]="form.invalid"
          class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
    Save Task
  </button>
</form>
