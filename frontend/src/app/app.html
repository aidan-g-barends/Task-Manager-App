<div class="flex h-screen bg-gray-50">
  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-gray-200 flex flex-col py-6 px-4 fixed h-full">
    <div class="mb-8 px-2 flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-sm">TM</div>
      <div>
        <h1 class="text-base font-bold text-gray-900">Task Manager</h1>
        <p class="text-xs text-gray-500">Productivity Workspace</p>
      </div>
    </div>

    <button routerLink="/tasks/new" class="w-full bg-blue-600 text-white text-sm font-medium py-2.5 rounded-lg mb-6 hover:bg-blue-700 transition-colors">
      + New Project
    </button>

    <nav class="flex-1 space-y-1">
      <a routerLink="/" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-blue-50 text-blue-700 font-semibold text-sm">
        <span class="material-symbols-outlined text-xl">assignment</span>
        All Tasks
      </a>
      <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 text-sm">
        <span class="material-symbols-outlined text-xl">person_check</span>
        My Tasks
      </a>
      <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 text-sm">
        <span class="material-symbols-outlined text-xl">check_circle</span>
        Completed
      </a>
      <a routerLink="/users" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 text-sm">
        <span class="material-symbols-outlined text-xl">group</span>
        Users
      </a>
    </nav>
  </aside>

  <!-- Main content -->
  <div class="ml-64 flex-1 flex flex-col">
    <!-- Top nav -->
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-10">
      <div class="relative w-72">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg">search</span>
        <input type="text" placeholder="Search workspace..."
               class="w-full pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500" />
      </div>
      <div class="flex items-center gap-3">
        <button routerLink="/tasks/new" class="bg-blue-600 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">Create New</button>
        <button class="text-gray-500 hover:text-gray-800 text-sm px-2">Notifications</button>
      </div>
    </header>

    <!-- Page content -->
    <main class="flex-1 overflow-y-auto p-8">
      <div class="max-w-4xl mx-auto space-y-8">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
